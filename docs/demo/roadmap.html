<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Next — automation_central Roadmap</title>
<style>
:root {
  --bg:          #0c0e14;
  --bg-card:     #13161f;
  --bg-glass:    rgba(255,255,255,0.04);
  --accent:      #f0a500;
  --accent-dim:  rgba(240,165,0,0.10);
  --blue:        #60a5fa;
  --blue-dim:    rgba(96,165,250,0.10);
  --green:       #22c55e;
  --text:        #e2e8f0;
  --text-dim:    #64748b;
  --text-mid:    #94a3b8;
  --border:      rgba(255,255,255,0.07);
  --path-gap:    4rem;   /* width of h-connector between cards */
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 56px;
  background: rgba(12,14,20,0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-back {
  display: flex; align-items: center; gap: 0.5rem;
  color: var(--text-dim); text-decoration: none; font-size: 0.875rem;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--text); }
.nav-back svg { width: 16px; height: 16px; }
.nav-logo { font-family: 'Courier New', monospace; font-size: 0.95rem; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.nav-logo span { color: var(--text-dim); font-weight: 400; }

/* ── HEADER ── */
#header {
  padding: 6.5rem 2rem 3rem; text-align: center;
  position: relative; overflow: hidden;
}
.header-glow {
  position: absolute; width: 600px; height: 300px;
  background: radial-gradient(ellipse, rgba(240,165,0,0.06) 0%, transparent 70%);
  top: 0; left: 50%; transform: translateX(-50%); pointer-events: none;
}
.header-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.75rem; }
.header-title { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 1rem; }
.header-sub { font-size: 1.05rem; color: var(--text-mid); max-width: 560px; margin: 0 auto 2rem; }

.legend {
  display: inline-flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.6rem 1.5rem;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--text-mid); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.ld-critical { background: var(--accent); }
.ld-high     { background: var(--blue); }
.ld-ongoing  { background: var(--text-dim); }

/* ── SNAKE CONTAINER ── */
.snake-wrapper {
  max-width: 980px;
  margin: 3rem auto 5rem;
  padding: 0 2rem;
}

/* ── SNAKE ROW ── */
.snake-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
}
.snake-row.rtl { flex-direction: row-reverse; }

/* ── H CONNECTOR ── */
.h-line {
  width: var(--path-gap);
  flex-shrink: 0;
  align-self: stretch;
  position: relative;
  display: flex;
  align-items: center;
}
.h-line::before {
  content: '';
  position: absolute;
  left: 2px; right: 2px;
  height: 2px;
  background: repeating-linear-gradient(
    90deg,
    rgba(240,165,0,0.55) 0, rgba(240,165,0,0.55) 6px,
    transparent 6px, transparent 13px
  );
}
.h-line::after {
  content: '';
  position: absolute;
  right: -1px;
  width: 0; height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 7px solid rgba(240,165,0,0.6);
}
.snake-row.rtl .h-line::before {
  background: repeating-linear-gradient(
    270deg,
    rgba(96,165,250,0.55) 0, rgba(96,165,250,0.55) 6px,
    transparent 6px, transparent 13px
  );
}
.snake-row.rtl .h-line::after {
  left: -1px; right: auto;
  border-left: none;
  border-right: 7px solid rgba(96,165,250,0.6);
}

/* ── SNAKE CURVE ── */
.snake-curve {
  /* width = (container - path-gap) / 4 ≈ 23.5% */
  width: calc((100% - var(--path-gap)) / 4);
  height: 3rem;
}
.curve-right {
  margin-left: auto;
  border-right: 2px dashed rgba(240,165,0,0.4);
  border-bottom: 2px dashed rgba(240,165,0,0.4);
  border-radius: 0 0 1.5rem 0;
}
.curve-left {
  margin-right: auto;
  border-left: 2px dashed rgba(96,165,250,0.4);
  border-bottom: 2px dashed rgba(96,165,250,0.4);
  border-radius: 0 0 0 1.5rem;
}

/* ── PHASE CARD ── */
.phase-card {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s, transform 0.5s, border-color 0.2s;
}
.phase-card.visible { opacity: 1; transform: none; }
.phase-card:hover { box-shadow: 0 0 0 1px var(--card-accent, var(--accent)); }

.phase-card.priority-critical {
  --card-accent: var(--accent);
  --card-accent-dim: var(--accent-dim);
}
.phase-card.priority-high {
  --card-accent: var(--blue);
  --card-accent-dim: var(--blue-dim);
}
.phase-card.priority-ongoing {
  --card-accent: var(--text-dim);
  --card-accent-dim: rgba(100,116,139,0.08);
}

/* card header */
.card-head {
  padding: 1.25rem 1.25rem 1rem;
  display: flex; flex-direction: column; gap: 0.75rem;
  user-select: none;
}
.card-top-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;
}
.phase-num {
  font-family: 'Courier New', monospace;
  font-size: 2.2rem; font-weight: 800; line-height: 1;
  color: var(--card-accent);
  opacity: 0.25;
}
.card-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 0.2rem 0.5rem; border-radius: 4px;
}
.badge-priority {
  background: var(--card-accent-dim);
  color: var(--card-accent);
  border: 1px solid color-mix(in srgb, var(--card-accent) 25%, transparent);
}
.badge-count {
  background: var(--bg-glass);
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.card-title {
  font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3;
}
.card-tag {
  font-size: 0.72rem; font-family: 'Courier New', monospace;
  color: var(--card-accent); opacity: 0.7; margin-bottom: 0.1rem;
}
.card-desc {
  font-size: 0.82rem; color: var(--text-dim); line-height: 1.5;
}
.card-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); padding: 0.6rem 1.25rem;
  font-size: 0.75rem; color: var(--text-dim);
}
.card-chevron {
  width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 50%;
  font-size: 0.6rem; transition: transform 0.25s;
  color: var(--text-dim);
}
.phase-card.open .card-chevron { transform: rotate(180deg); }

/* feature list */
.card-features {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-top: 1px solid transparent;
}
.phase-card.open .card-features {
  max-height: 600px;
  border-top-color: var(--border);
}
.feature-list {
  padding: 0.75rem 1.25rem 1rem;
  display: flex; flex-direction: column; gap: 0.4rem;
}
.feature-item {
  display: flex; align-items: flex-start; gap: 0.6rem;
  padding: 0.4rem 0.6rem; border-radius: 7px; font-size: 0.79rem;
  background: var(--bg-glass); border: 1px solid var(--border);
  transition: background 0.15s;
}
.feature-item:hover { background: var(--card-accent-dim); }
.feature-id {
  font-family: 'Courier New', monospace; font-size: 0.68rem;
  color: var(--card-accent); opacity: 0.7; white-space: nowrap; margin-top: 1px;
  flex-shrink: 0;
}
.feature-title { color: var(--text-mid); line-height: 1.4; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border); padding: 2rem; text-align: center;
  color: var(--text-dim); font-size: 0.82rem;
}
footer strong { color: var(--accent); font-family: 'Courier New', monospace; }

/* ── RESPONSIVE ── */
@media (max-width: 680px) {
  .snake-row, .snake-row.rtl { flex-direction: column; }
  .h-line { width: 2px; height: 2rem; align-self: center; }
  .h-line::before {
    left: 50%; right: auto; top: 0; bottom: 0; width: 2px; height: auto;
    background: repeating-linear-gradient(
      180deg, rgba(240,165,0,0.5) 0, rgba(240,165,0,0.5) 6px, transparent 6px, transparent 13px
    );
  }
  .h-line::after { display: none; }
  .snake-curve { display: none; }
}
</style>
</head>
<body>

<!-- ══ NAV ══ -->
<nav>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
    Back to overview
  </a>
  <div class="nav-logo">automation_central <span>/ Roadmap</span></div>
</nav>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="header-glow"></div>
  <div class="header-label">Roadmap — Live from Azure DevOps</div>
  <h1 class="header-title">What's next.</h1>
  <p class="header-sub">5 phases, 43 features tracked in ADO. Click any phase to see what's inside.</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot ld-critical"></div> Critical priority</div>
    <div class="legend-item"><div class="legend-dot ld-high"></div> High priority</div>
    <div class="legend-item"><div class="legend-dot ld-ongoing"></div> Ongoing backlog</div>
  </div>
</div>

<!-- ══ SNAKE ROADMAP ══ -->
<div class="snake-wrapper" id="snake">
  <!-- Rendered by JS -->
</div>

<footer>
  <strong>automation_central</strong> &nbsp;·&nbsp; ABI Engineering &nbsp;·&nbsp; Roadmap sourced from Azure DevOps
</footer>

<script>
// ── ROADMAP DATA (from ADO board) ─────────────────────────────────────────────
const phases = [
  {
    epicId: 165353, num: '00', tag: 'Phase 0',
    title: 'Production Gate',
    priority: 'critical', priorityLabel: 'Critical',
    desc: 'Quality gates and validators to ensure the repo stays consistent and healthy as it scales.',
    features: [
      [165354, 'Batch Validator Script'],
      [165366, 'Sync-Check Script'],
      [165378, 'CI Pipeline — GitHub Actions Validation'],
      [165390, 'Pre-Commit Hooks'],
      [165401, 'Copilot Skill Parity (12 missing counterparts)'],
      [165598, 'Agent Ground-Truth CI Quality Tests'],
      [165610, 'Example-Based Regression Test Fixtures'],
    ]
  },
  {
    epicId: 165419, num: '01', tag: 'Phase 1',
    title: 'Developer Experience',
    priority: 'critical', priorityLabel: 'Critical',
    desc: 'Make it faster and friendlier to contribute skills, onboard new team members, and navigate the repo.',
    features: [
      [165420, 'Interactive Skill Scaffolder'],
      [165428, 'Interactive Agent Scaffolder'],
      [165439, 'Catalog Build Script'],
      [165446, 'Hotkey Reference Sheet'],
      [165452, 'Environment Bootstrap Scripts'],
      [165620, 'Info Agent (read-only repo navigation assistant)'],
      [165630, 'Per-Skill and Per-Agent Quickstart Examples'],
    ]
  },
  {
    epicId: 165464, num: '02', tag: 'Phase 2',
    title: 'Observability',
    priority: 'high', priorityLabel: 'High',
    desc: 'Understand how skills are being used, measure output quality, and close the feedback loop.',
    features: [
      [165465, 'Usage Metrics Script'],
      [165473, 'Health Check Script'],
      [165486, 'Changelog Generator'],
      [165637, 'Runtime Skill / Agent Invocation Analytics'],
      [165647, 'Skill Output Feedback Loop and Resolution Skill'],
      [165657, 'QA Agent — automated quality rater for agent outputs'],
    ]
  },
  {
    epicId: 165492, num: '03', tag: 'Phase 3',
    title: 'Skill Portfolio Expansion',
    priority: 'high', priorityLabel: 'High',
    desc: 'Grow the catalog with high-value skills across data engineering, GitHub, Confluence, and comms.',
    features: [
      [165493, 'GraphRAG Knowledge Graph Skill'],
      [165504, 'Confluence Publisher Agent'],
      [165516, 'Issue-to-Story Skill'],
      [165527, 'Pipeline Audit Skill'],
      [165534, 'Patch Notes Agent'],
      [165667, 'Ingest EDA for Intelligent Catalog Skill'],
      [165674, 'Data Engineer Agent'],
      [165684, 'Improve Analysis Template Skill'],
    ]
  },
  {
    epicId: 165553, num: '04', tag: 'Phase 4',
    title: 'Platform Integration',
    priority: 'high', priorityLabel: 'High',
    desc: 'Full Microsoft Graph integration — Teams, Outlook, and a dynamic multi-agent orchestrator.',
    features: [
      [165555, 'MS Graph API Integration'],
      [165554, 'Multi-Agent Orchestration Workflows'],
      [165556, 'Personal Assistant Agent'],
      [165691, 'Teams Manager Agent'],
      [165703, 'Outlook Manager Agent'],
      [165715, 'Dynamic Orchestrator Agent (agent-of-agents)'],
    ]
  },
  {
    epicId: 167023, num: '—', tag: 'Ongoing',
    title: 'Skills & Agents Backlog',
    priority: 'ongoing', priorityLabel: 'Ongoing',
    desc: 'Continuous backlog for miscellaneous skill improvements and new agent experiments.',
    features: [
      [167024, 'Ground Truth Question Curation'],
    ]
  },
];

// ── SNAKE LAYOUT PLAN ─────────────────────────────────────────────────────────
// Row 1 LTR: [Phase 0] → [Phase 1]
// Curve right
// Row 2 RTL: [Phase 2] ← [Phase 3]   (Phase 2 on right, Phase 3 on left)
// Curve left
// Row 3 LTR: [Phase 4] → [Phase 5]

const layout = [
  { type: 'row', dir: 'ltr', indices: [0, 1] },
  { type: 'curve', side: 'right' },
  { type: 'row', dir: 'rtl', indices: [2, 3] },
  { type: 'curve', side: 'left' },
  { type: 'row', dir: 'ltr', indices: [4, 5] },
];

// ── RENDER ────────────────────────────────────────────────────────────────────
function buildCard(phase) {
  const featureItems = phase.features.map(([id, title]) =>
    `<div class="feature-item">
       <span class="feature-id">#${id}</span>
       <span class="feature-title">${title}</span>
     </div>`
  ).join('');

  return `
    <div class="phase-card priority-${phase.priority}" data-idx="${phases.indexOf(phase)}">
      <div class="card-head">
        <div class="card-top-row">
          <div class="phase-num">${phase.num}</div>
          <div class="card-badges">
            <span class="badge badge-priority">${phase.priorityLabel}</span>
            <span class="badge badge-count">${phase.features.length} features</span>
          </div>
        </div>
        <div>
          <div class="card-tag">${phase.tag} · Epic #${phase.epicId}</div>
          <div class="card-title">${phase.title}</div>
        </div>
        <div class="card-desc">${phase.desc}</div>
      </div>
      <div class="card-toggle-row">
        <span>See features</span>
        <div class="card-chevron">▼</div>
      </div>
      <div class="card-features">
        <div class="feature-list">${featureItems}</div>
      </div>
    </div>`;
}

function buildSnake() {
  const snake = document.getElementById('snake');
  let html = '';
  for (const block of layout) {
    if (block.type === 'row') {
      const [a, b] = block.indices.map(i => buildCard(phases[i]));
      html += `<div class="snake-row${block.dir === 'rtl' ? ' rtl' : ''}">
        ${a}
        <div class="h-line"></div>
        ${b}
      </div>`;
    } else {
      html += `<div class="snake-curve curve-${block.side}"></div>`;
    }
  }
  snake.innerHTML = html;
}

buildSnake();

// ── TOGGLE EXPAND ─────────────────────────────────────────────────────────────
document.getElementById('snake').addEventListener('click', e => {
  const card = e.target.closest('.phase-card');
  if (!card) return;
  card.classList.toggle('open');
});

// ── SCROLL ANIMATIONS ─────────────────────────────────────────────────────────
const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const el = entry.target;
    const idx = Number(el.dataset.idx);
    // Stagger cards within the same row
    setTimeout(() => el.classList.add('visible'), (idx % 2) * 150);
    cardObserver.unobserve(el);
  });
}, { threshold: 0.1 });

document.querySelectorAll('.phase-card').forEach(card => cardObserver.observe(card));
</script>
</body>
